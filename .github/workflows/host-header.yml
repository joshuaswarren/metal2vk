name: host-header

# The C header of the host layer (host/m2v-host/include/metal2vk.h) is generated by cbindgen and checked in. It must stay plain C99,
# compile as C++, and match what the build generates.

on:
  pull_request:
    paths: ["host/**", ".github/workflows/host-header.yml"]
  push:
    branches: [main]
    paths: ["host/**"]

jobs:
  header:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: C99 and C++ syntax
        run: |
          cc -std=c99 -Wall -Werror -fsyntax-only -x c host/m2v-host/include/metal2vk.h
          c++ -std=c++17 -Wall -Werror -fsyntax-only -x c++ host/m2v-host/include/metal2vk.h
      - name: Header is what the build generates
        working-directory: host
        run: |
          cargo build -p m2v-host
          git diff --exit-code -- m2v-host/include/metal2vk.h
      - name: Host tests
        working-directory: host
        run: cargo test -p m2v-host -p mtl-rs
