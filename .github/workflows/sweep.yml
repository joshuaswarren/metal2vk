name: sweep

# Three jobs. `clspv` builds the patched clspv once and saves it in the cache; `gate` compiles the four reference cases and fails on any missing
# or invalid SPIR-V (a shim change that breaks the real pipeline fails here, in minutes); `sweep` runs every uzu and TensorFold Zig kernel
# (compile only, clang 23) and fails if an entry that had valid Vulkan SPIR-V loses it.
# The floor is sweep/coverage-floor.txt; raise it with `sweep/check_coverage.py RESULT.json --update` in the PR that gains entries.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: sweep-${{ github.ref }}
  cancel-in-progress: true

env:
  CLSPV_SHA: f2b01dd6dce7058585eb4bcdb5326997cfeebfd4
  UZU_SHA: c92723bdc04e40f55286de458a457172ce62c5b6
  TF_SHA: f8fe17d24629aedabf90bbf78279dd776e6d62e7

jobs:
  clspv:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: clspv cache
        id: cache
        uses: actions/cache@v4
        with:
          path: clspv/build/bin/clspv
          key: clspv-${{ hashFiles('clspv-patches/**') }}-f2b01dd6

      - name: Build clspv with the m2v patches
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build python3
          git clone -q https://github.com/google/clspv
          cd clspv
          git checkout -q "$CLSPV_SHA"
          python3 utils/fetch_sources.py --shallow
          # order matters: the f16 script needs the lowering; list a new patch here
          for p in apply-coopmat-lowering.py apply-coopmat-f16.py apply-m2v-marker.py apply-spec-constants.py apply-undef-pointer-type.py apply-simplify-ptr-bitcast-converge.py apply-untyped-gep-predicate.py apply-untyped-capability-gate.py apply-implicit-casts-converge.py apply-implicit-casts-hash-break.py apply-simplify-iteration-hash-break.py apply-simplify-no-exit.py apply-continue-latch.py apply-producer-private-ptr-access-chain.py apply-implicit-casts-lossless-merge.py apply-isolate-continue-exits.py; do python3 "$GITHUB_WORKSPACE/clspv-patches/$p" .; done
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCLSPV_BUILD_TESTS=OFF -B build
          ninja -C build clspv

  gate:
    needs: clspv
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UZU_ROOT: ${{ github.workspace }}/uzu
      CLANG: clang-23
      OPT: opt-23
      CLSPV: ${{ github.workspace }}/clspv/build/bin/clspv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: clspv/build/bin/clspv
          key: clspv-${{ hashFiles('clspv-patches/**') }}-f2b01dd6
          fail-on-cache-miss: true
      - name: Toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-23 llvm-23 spirv-tools python3
      - name: Kernel sources
        run: git clone -q https://github.com/trymirai/uzu && git -C uzu checkout -q "$UZU_SHA"
      - name: Compile the reference cases
        run: |
          cases="activation softmax tilematmul_rt gemm"
          bash compile.sh out $cases
          # compile.sh pipes spirv-val through head, so its own "rc" line is not the validator's: check each module here
          fail=0
          for c in $cases; do
            if [ ! -s "out/$c.spv" ]; then echo "::error::$c: no SPIR-V produced"; fail=1; continue; fi
            spirv-val --target-env vulkan1.3 "out/$c.spv" || { echo "::error::$c: spirv-val failed"; fail=1; }
          done
          exit $fail

  sweep:
    needs: clspv
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: clspv/build/bin/clspv
          key: clspv-${{ hashFiles('clspv-patches/**') }}-f2b01dd6
          fail-on-cache-miss: true

      - name: Toolchain (clang 23, opt 23, spirv-tools)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-23 llvm-23 spirv-tools python3 python3-numpy

      - name: Kernel sources
        run: |
          git clone -q https://github.com/trymirai/uzu && git -C uzu checkout -q "$UZU_SHA"
          git clone -q --filter=blob:none https://github.com/ashhart/TensorFold && git -C TensorFold checkout -q "$TF_SHA"

      - name: IR pass self-checks
        env:
          CLANG: clang-23
          OPT: opt-23
          CLSPV: ${{ github.workspace }}/clspv/build/bin/clspv
        run: python3 sweep/tests/run.py

      - name: m2v-compile CLI self-checks
        env:
          CLANG: clang-23
          OPT: opt-23
          CLSPV: ${{ github.workspace }}/clspv/build/bin/clspv
        run: python3 tools/tests/run.py

      - name: Sweep
        env:
          UZU_ROOT: ${{ github.workspace }}/uzu
          TF_ROOT: ${{ github.workspace }}/TensorFold
          CLANG: clang-23
          OPT: opt-23
          CLSPV: ${{ github.workspace }}/clspv/build/bin/clspv
          M2V_CLSPV_TIMEOUT: "300"
        run: python3 sweep/m2v_sweep.py out --set all --jobs "$(nproc)" --tag ci

      - name: Coverage gate
        run: python3 sweep/check_coverage.py out/ci.json | tee coverage.txt

      - name: Parity harness dry run
        run: |
          PARITY_FAKE=1 PARITY_SWEEP=out/ci.json PARITY_SPV_DIR=out \
            PARITY_OUT=out/parity-mlx python3 sweep/parity_mlx.py
          PARITY_FAKE=1 PARITY_SWEEP=out/ci.json PARITY_SPV_DIR=out \
            PARITY_MLX_OUT=out/parity-mlx PARITY_OUT=out/parity-cmp \
            python3 sweep/parity_compare.py --fake
          python3 sweep/parity_compare.py --compare-only \
            --mlx-out out/parity-mlx --cmp-out out/parity-cmp
          test -s out/parity-cmp/parity.tsv

      - name: Failure report
        if: always()
        run: |
          python3 sweep/report.py out/ci.json --features out/FEATURES.md --failures out/FAILURES.md || true
          { echo '```'; head -n 1 coverage.txt; echo '```'; cat out/FEATURES.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep
          path: |
            out/ci.json
            out/FEATURES.md
            out/FAILURES.md
