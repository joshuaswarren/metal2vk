language = "C"
header = "/* metal2vk C ABI, generated by cbindgen from host/m2v-host/src/capi.rs. Do not edit by hand. */"
include_version = true
sys_includes = ["stdint.h", "stdbool.h"]
no_includes = false
autogen_warning = "/* regenerated; edits here are lost */"

[export]
include = [
    "m2v_status",
    "m2v_device_info",
    "m2v_constant_kind",
    "m2v_constant_value",
    "m2v_constant",
    "m2v_completion_fn",
    "m2v_device",
    "m2v_buffer",
    "m2v_library",
    "m2v_pipeline",
    "m2v_queue",
    "m2v_cmdbuf",
    "m2v_event",
    "m2v_encoder",
    "m2v_timestamp_pool",
]
exclude = ["VA_ALIGN", "M2VLIB_MAGIC", "M2VLIB_VERSION"]

[enum]
prefix_with_name = true

[parse]
clean = false

[fn]
# exact m2v_* names already; nothing to rewrite
