[package]
name = "m2v-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Metal-style device/queue/pipeline/dispatch layer over Vulkan 1.3, with a C ABI"

[lib]
name = "metal2vk"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
ash = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cbindgen = "0.29"

# Test-only: compiles the waiter delay hook used by the queue lifecycle
# tests. Never enabled in release builds.
[features]
test-hooks = []

